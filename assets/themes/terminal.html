<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NAME}} · {{ROLE}}</title>
<style>
:root{--bg:#05060a;--fg:#e9fff6;--dim:#85958e;--g:#33ff99;--c:#5ce1ff;--p:#c084fc;--line:#ffffff1a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(70% 50% at 50% 0,#33ff9914,transparent 70%),var(--bg);color:var(--fg);font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#00000038 2px 3px);opacity:.35}
.boot{position:fixed;inset:0;z-index:9;display:grid;place-content:center;gap:16px;padding:24px;background:#030407;font:600 12px/1.8 ui-monospace,monospace;color:var(--g);animation:boot 1.1s 2.8s forwards}
.boot pre{margin:0;white-space:pre-wrap}
.boot b{color:var(--c)}
@keyframes boot{to{opacity:0;visibility:hidden}}
header{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px clamp(18px,5vw,56px);border-bottom:1px solid var(--line)}
.logo{color:var(--fg);text-decoration:none;font:800 14px/1 ui-monospace,monospace;letter-spacing:.06em}
.logo span{color:var(--g)}
.status{display:flex;align-items:center;gap:8px;color:var(--dim);font:600 9px/1 ui-monospace,monospace;letter-spacing:.1em;white-space:nowrap}
.status i{width:6px;height:6px;border-radius:50%;background:var(--g);box-shadow:0 0 12px var(--g)}
main{position:relative;z-index:2;width:min(1120px,100%);margin:auto;padding:clamp(40px,7vw,86px) clamp(18px,5vw,56px) 34px}
.hero{display:grid;grid-template-columns:1fr auto;gap:clamp(28px,5vw,60px);align-items:center;min-height:46vh}
h1{margin:0 0 18px;font-size:clamp(38px,7.5vw,76px);line-height:.98;letter-spacing:-.055em}
h1 em{position:relative;font-style:normal;background:linear-gradient(100deg,var(--g),var(--c) 55%,var(--p));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 em:before,h1 em:after{content:attr(data-t);position:absolute;inset:0;background:var(--bg);opacity:0;animation:glitch 4s infinite steps(1)}
h1 em:before{color:var(--g);clip-path:inset(0 0 52% 0)}
h1 em:after{color:var(--c);clip-path:inset(48% 0 0 0);animation-delay:.12s}
@keyframes glitch{0%,91%,100%{opacity:0;transform:none}92%{opacity:.75;transform:translate(-3px,1px)}94%{opacity:.6;transform:translate(3px,-1px)}96%{opacity:.8;transform:translate(-1px,0)}}
.lede{max-width:44ch;margin:0 0 24px;color:var(--dim);font-size:clamp(14px,2.2vw,16px)}
.cta{display:flex;align-items:center;gap:12px}
.cta a{display:inline-flex;padding:10px 15px;border-radius:8px;background:var(--g);color:#03100a;text-decoration:none;font:700 11px/1 ui-monospace,monospace;letter-spacing:.06em;box-shadow:0 0 22px #33ff9933}
.cursor{display:inline-block;width:9px;height:16px;background:var(--c);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.portrait-box{position:relative;margin:0;padding:10px;border:1px solid var(--line);border-radius:8px;background:#0b0b12cc;box-shadow:0 0 40px #33ff9914}
.portrait{display:block;margin:0;color:var(--g);font:600 8px/1 ui-monospace,monospace;white-space:pre;overflow:hidden;animation:scan 1.3s .3s steps(24) both}
@keyframes scan{from{clip-path:inset(0 0 100% 0);opacity:.4}to{clip-path:inset(0 0 0 0);opacity:1}}
section{padding:34px 0;border-top:1px solid var(--line)}
h2{margin:0 0 18px;color:var(--g);font:700 10px/1 ui-monospace,monospace;letter-spacing:.16em}
.work{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.project{display:block;padding:16px;border:1px solid var(--line);border-radius:8px;background:#ffffff04;color:inherit;text-decoration:none;transition:border-color .2s,transform .2s}
.project:hover{border-color:#33ff9955;transform:translateY(-2px)}
.project small{display:block;margin-bottom:12px;color:var(--g);font:600 9px/1 ui-monospace,monospace;letter-spacing:.1em}
.project h3{margin:0 0 7px;font-size:15px;letter-spacing:-.02em}
.project p{margin:0;color:var(--dim);font-size:11px;line-height:1.55}
.links{display:flex;flex-wrap:wrap;gap:8px;padding-top:20px}
.link{display:inline-flex;gap:7px;align-items:baseline;padding:8px 10px;border:1px solid var(--line);border-radius:6px;color:var(--fg);text-decoration:none;font:600 10px/1 ui-monospace,monospace}
.link:hover{border-color:#5ce1ff66}
.link em{color:var(--dim);font-weight:400;font-style:normal}
.link b{color:var(--c);font-weight:400}
footer{position:relative;z-index:2;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px clamp(18px,5vw,56px) 30px;border-top:1px solid var(--line);color:var(--dim);font:600 9px/1.5 ui-monospace,monospace;letter-spacing:.08em}
footer b{color:var(--fg);font-variant-numeric:tabular-nums}
@media(max-width:760px){.hero{grid-template-columns:1fr}.portrait-box{width:fit-content}.work{grid-template-columns:1fr}.portrait{font-size:5px}header{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.boot{display:none}}
</style>
</head>
<body>
<div class="boot"><pre><b>ASM/WEB</b>  {{HANDLE}}
load  profile.json .. ok
mount /work ......... ok
serve :8080 ......... ok</pre></div>
<header><a class="logo" href="#">{{HANDLE}}<span>//</span>{{NAME}}</a><div class="status"><i></i>{{ROLE}}</div></header>
<main>
<section class="hero">
  <div><h1>{{HANDLE}}<br><em data-t="{{TAGLINE}}">{{TAGLINE}}</em></h1><p class="lede">{{BIO}}</p><div class="cta"><a href="#work">看我在做什么</a><span class="cursor"></span></div></div>
  <figure class="portrait-box">{{PORTRAIT}}</figure>
</section>
<section id="work"><h2>SELECTED WORK</h2><div class="work">{{FEATURED_PROJECTS}}</div></section>
<div class="links">{{LINKS_COMPACT}}</div>
</main>
<footer><span>{{NAME}}</span><span>LOCAL TIME · <b id="clock">--:--:--</b></span></footer>
{{CLOCK_SCRIPT}}
</body>
</html>
