<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NAME}} · {{ROLE}}</title>
<style>
:root{--bg:#071018;--fg:#dff6ff;--dim:#6d8b99;--a:#ff9e64;--c:#5ce1ff;--line:#5ce1ff2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 ui-monospace,Consolas,monospace;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#5ce1ff0e 1px,transparent 1px),linear-gradient(90deg,#5ce1ff0e 1px,transparent 1px);background-size:40px 40px}
.scan{position:fixed;left:0;right:0;top:0;height:1px;background:var(--c);box-shadow:0 0 18px var(--c);opacity:.35;animation:scan 7s linear infinite;pointer-events:none;z-index:5}
@keyframes scan{to{transform:translateY(100vh)}}
.wrap{position:relative;width:min(94vw,1080px);margin:auto;padding:0 0 50px}
header{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}
.logo{color:var(--c);font:700 12px/1 ui-monospace,monospace;letter-spacing:.12em;text-decoration:none}
.logo b{color:var(--a)}
nav{display:flex;gap:16px;font:600 9px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
nav a{color:var(--dim);text-decoration:none}
nav a:hover{color:var(--c)}
.hero{display:grid;grid-template-columns:1fr auto;gap:clamp(24px,5vw,60px);align-items:center;padding:clamp(48px,8vw,90px) 0 40px;border-bottom:1px solid var(--line)}
.kicker{margin:0 0 14px;color:var(--a);font:700 10px/1 ui-monospace,monospace;letter-spacing:.16em}
h1{margin:0 0 14px;font:700 clamp(34px,6vw,64px)/1.05 ui-monospace,Consolas,monospace;letter-spacing:-.06em}
h1 span{color:var(--c)}
.lede{max-width:56ch;margin:0;color:#a9c3ce;font-size:14px}
.portrait-box{position:relative;padding:12px;border:1px solid var(--line);background:#04101899}
.portrait-box:before,.portrait-box:after{content:"";position:absolute;width:10px;height:10px;border-color:var(--c);border-style:solid}
.portrait-box:before{left:-1px;top:-1px;border-width:1px 0 0 1px}
.portrait-box:after{right:-1px;bottom:-1px;border-width:0 1px 1px 0}
.portrait{display:block;margin:0;color:var(--c);font:600 7px/1 ui-monospace,monospace;white-space:pre;overflow:hidden}
section{padding:40px 0;border-bottom:1px solid var(--line)}
h2{margin:0 0 20px;color:var(--c);font:700 10px/1 ui-monospace,monospace;letter-spacing:.16em}
h2 span{color:var(--a)}
.work{display:grid}
.project{display:grid;grid-template-columns:44px 1fr;gap:6px 14px;padding:14px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;animation:reveal .7s both}
.project:hover{background:#5ce1ff08}
.project small{color:var(--a);font:600 10px/1 ui-monospace,monospace}
.project h3{margin:0;font:600 16px/1.3 ui-monospace,monospace;letter-spacing:-.02em}
.project p{grid-column:2;margin:0;color:var(--dim);font-size:11px;line-height:1.5}
.project:nth-child(2){animation-delay:.06s}.project:nth-child(3){animation-delay:.12s}.project:nth-child(4){animation-delay:.18s}.project:nth-child(5){animation-delay:.24s}
@keyframes reveal{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.about p{max-width:70ch;margin:0 0 12px;color:#a9c3ce;font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:18px}
.link{display:inline-flex;gap:6px;align-items:baseline;color:var(--fg);text-decoration:none;font:600 11px/1.4 ui-monospace,monospace;border-bottom:1px solid var(--line);padding-bottom:3px}
.link:hover{color:var(--c);border-color:var(--c)}
.link em{color:var(--dim);font:400 10px/1.4 ui-monospace,monospace;font-style:normal}
.link b{color:var(--a);font-weight:400}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:20px;color:var(--dim);font:600 8px/1.5 ui-monospace,monospace;letter-spacing:.1em}
footer b{color:var(--c);font-variant-numeric:tabular-nums}
@media(max-width:760px){.hero{grid-template-columns:1fr}.portrait-box{width:fit-content}.project{grid-template-columns:32px 1fr}.portrait{font-size:5px}header{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="scan"></div>
<div class="wrap">
<header><a class="logo" href="#">ASM/WEB <b>//</b> {{HANDLE}}</a><nav><a href="#work">Work</a><a href="#about">About</a><a href="#contact">Contact</a></nav></header>
<section class="hero">
  <div><p class="kicker">FIG. 01 / PROFILE — {{ROLE}}</p><h1>{{TAGLINE}}<br><span>{{NAME}}</span></h1><p class="lede">{{BIO}}</p></div>
  <figure class="portrait-box">{{PORTRAIT}}</figure>
</section>
<section id="work"><h2>MANIFEST <span>/ {{YEAR}}</span></h2><div class="work">{{FEATURED_PROJECTS}}</div></section>
<section id="about" class="about"><h2>NOTES</h2>{{ABOUT_SHORT}}</section>
<section id="contact"><h2>ENDPOINTS</h2><div class="links">{{LINKS}}</div></section>
<footer><span>SYS {{NAME}}</span><span>UPDATED {{YEAR}} · <b id="clock">--:--:--</b></span></footer>
</div>
{{CLOCK_SCRIPT}}
</body>
</html>
