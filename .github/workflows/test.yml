name: test

on:
  push:
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Doctor
        run: python scripts/asmweb.py doctor

      - name: Build engine demo, verify with Unicorn
        run: python scripts/asmweb.py build assets/example/index.html -o dist --v40 --minify --emulate

      - name: Extract and inspect engine QR
        run: |
          python scripts/asmweb.py extract dist/index.png -o dist/extracted.elf --html dist/extracted.html
          cmp dist/index.elf dist/extracted.elf
          cmp dist/index.page.html dist/extracted.html
          python scripts/asmweb.py inspect dist/index.elf --html dist/inspected.html --no-disasm
          cmp dist/index.page.html dist/inspected.html

      - name: Build all personal themes, verify with Unicorn
        run: |
          set -euo pipefail
          for theme in terminal brutalist editorial blueprint; do
            python scripts/asmweb.py personal assets/example/profile.json \
              --theme "$theme" -o "dist/personal/$theme" --emulate
          done

      - name: Extract and inspect personal QR
        run: |
          python scripts/asmweb.py extract dist/personal/terminal/terminal.png \
            -o dist/personal/terminal/extracted.elf \
            --html dist/personal/terminal/extracted.html
          cmp dist/personal/terminal/terminal.elf dist/personal/terminal/extracted.elf
          cmp dist/personal/terminal/terminal.page.html dist/personal/terminal/extracted.html
          python scripts/asmweb.py inspect dist/personal/terminal/terminal.elf \
            --html dist/personal/terminal/inspected.html --no-disasm
          cmp dist/personal/terminal/terminal.page.html dist/personal/terminal/inspected.html

      - name: Run a personal theme natively on Linux
        run: |
          chmod +x dist/personal/terminal/terminal.elf
          ./dist/personal/terminal/terminal.elf &
          pid=$!
          sleep 0.5
          python scripts/native_test.py dist/personal/terminal/terminal.page.html
          kill $pid || true

      - name: Show ELF
        run: |
          file dist/personal/terminal/terminal.elf
          readelf -h -l dist/personal/terminal/terminal.elf
